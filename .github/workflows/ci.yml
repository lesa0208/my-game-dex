# Fast checks for pull requests into main. Database tests need Docker and the local
# Supabase stack, so they stay local: run `npm run db:verify` before opening a PR.
name: CI

on:
  pull_request:
    branches: [main]

# Read-only token: the job only needs to check out the code.
permissions:
  contents: read

# A new push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, build and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned to full commit SHAs, so a moved tag can't change what runs.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan files for secrets
        run: npm run secrets:check

      - name: Test the secret scanner
        run: npm run secrets:test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Scan browser bundles for secrets
        run: npm run secrets:bundle
